# Environnement d'atelier MISTRAL — instance cible épinglée + source legacy.
#
# L'épinglage (2 vCPU, 8 Go, swap désactivé) n'est pas un confort : sans lui
# les mesures des participants ne sont pas comparables (L01).
# PGDATA est monté sur le disque hôte : les jeux dépassent la partition
# du démon docker sur la plupart des postes. Les répertoires pgdata/,
# pgdata-legacy/ et archives/ doivent exister AVANT le premier démarrage et
# appartenir à l'utilisateur courant (uid 1000, comme postgres dans l'image) :
# amont/restaurer.sh les crée ; sinon `mkdir -p pgdata pgdata-legacy archives`.
# Un répertoire créé par Docker appartient à root et l'instance ne démarre pas.
#
# Profil « outils » (facultatif, jamais démarré par défaut) :
#   docker compose --profile outils up -d     → Grafana (L15) et pgAdmin
#   Grafana : http://127.0.0.1:3000  admin / mistral
#   pgAdmin : http://127.0.0.1:5050  (serveurs préenregistrés, mot de passe : mistral)
# Ni l'un ni l'autre ne sert à mesurer : le protocole reste psql + mesure.sh.

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg17
    container_name: timescaledb
    cpuset: "0,1"
    mem_limit: 8g
    memswap_limit: 8g          # mémoire = mémoire+swap : pas de swap
    shm_size: 1g
    environment:
      POSTGRES_PASSWORD: mistral
      PGDATA: /home/postgres/pgdata/data
    command: >
      postgres -c shared_preload_libraries=timescaledb,pg_stat_statements
    ports:
      - "127.0.0.1:6543:5432"
    volumes:
      - ./pgdata:/home/postgres/pgdata
      - ../generateur/output:/jeux:ro
      - ./conf:/conf:ro
      - ./archives:/archives          # archivage des journaux (L12)
      - .:/atelier:ro                 # les fichiers des labs, pour \i depuis psql

  legacy:
    image: postgres:16
    container_name: legacy
    environment:
      POSTGRES_PASSWORD: mistral
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres -c wal_level=logical
    ports:
      - "127.0.0.1:6544:5432"
    volumes:
      - ./pgdata-legacy:/var/lib/postgresql/data
      - ../generateur/output:/jeux:ro
      - .:/atelier:ro                  # L11 : \i l11/controles.sql côté source aussi

  grafana:
    image: grafana/grafana:12.1.0
    container_name: grafana
    profiles: ["outils"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: mistral
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./outils/grafana/datasources.yml:/etc/grafana/provisioning/datasources/mistral.yml:ro
      - ./l15:/l15:ro                  # tableau-de-bord.json, à importer depuis l'interface
    depends_on:
      - timescaledb

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    profiles: ["outils"]
    environment:
      PGADMIN_DEFAULT_EMAIL: formateur@janus-academy.fr   # pgAdmin refuse les domaines réservés (.local, .example)
      PGADMIN_DEFAULT_PASSWORD: mistral
      PGADMIN_CONFIG_SERVER_MODE: "False"                 # pas d'écran de connexion
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0                     # IPv4 seul : l'image écoute sur [::] et échoue si IPv6 est désactivé sur le poste
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./outils/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - timescaledb
      - legacy

volumes:
  grafana-data:
  pgadmin-data:
